name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 – Test the Python HTTP service
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test Python HTTP Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: python -m py_compile hello.py && echo "Syntax OK"

      - name: Start HTTP server in background
        run: |
          python hello.py > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 15 s for the server to accept connections
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            echo "Waiting... (${i}s)"
            sleep 1
          done

      - name: Test GET /
        run: |
          RESPONSE=$(curl -sf http://localhost:8080)
          echo "Response: '$RESPONSE'"
          if [ "$RESPONSE" != "Hello, DevOps!" ]; then
            echo "FAIL: expected 'Hello, DevOps!' but got '$RESPONSE'"
            exit 1
          fi
          echo "PASS: GET / returned 'Hello, DevOps!'"

      - name: Test GET /health
        run: |
          RESPONSE=$(curl -sf http://localhost:8080/health)
          echo "Response: '$RESPONSE'"
          if [ "$RESPONSE" != "healthy" ]; then
            echo "FAIL: expected 'healthy' but got '$RESPONSE'"
            exit 1
          fi
          echo "PASS: GET /health returned 'healthy'"

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-server-log
          path: server.log

      - name: Stop HTTP server
        if: always()
        run: |
          kill "$SERVER_PID" 2>/dev/null || true
          echo "Server stopped"

  # ─────────────────────────────────────────────────────────────────
  # Job 2 – Build and push Docker image to GHCR
  # Runs only after the test job passes.
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/devops-hello:latest"
          IMAGE_LC="${IMAGE,,}"
          echo "name=${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_LC}"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.image.outputs.name }}" .
          echo "Build complete: ${{ steps.image.outputs.name }}"

      - name: Smoke-test the Docker image
        run: |
          docker run -d \
            --name smoke-test \
            -p 8080:8080 \
            "${{ steps.image.outputs.name }}"

          # Wait for the container to start
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done

          RESP=$(curl -sf http://localhost:8080)
          echo "GET /        → '$RESP'"
          HEALTH=$(curl -sf http://localhost:8080/health)
          echo "GET /health  → '$HEALTH'"

          docker logs smoke-test
          docker stop smoke-test
          docker rm smoke-test

          [ "$RESP"   = "Hello, DevOps!" ] || { echo "FAIL: unexpected response"; exit 1; }
          [ "$HEALTH" = "healthy"         ] || { echo "FAIL: unexpected health";   exit 1; }
          echo "PASS: Docker smoke-test passed"

      - name: Push Docker image to GHCR
        run: |
          docker push "${{ steps.image.outputs.name }}"
          echo "Pushed: ${{ steps.image.outputs.name }}"

      - name: Verify push (image digest)
        run: |
          docker inspect "${{ steps.image.outputs.name }}" \
            --format 'Digest: {{index .RepoDigests 0}}'
